<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Регистрация</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <form class="reg-form" action="#" method="post">
      <input
        class="reg-input"
        type="text"
        name="name"
        placeholder="Имя"
        autocomplete="name"
        required
      />
      <input
        class="reg-input"
        type="email"
        name="email"
        placeholder="E-mail"
        autocomplete="email"
        required
      />
      <input
        class="reg-input"
        type="tel"
        name="phone"
        placeholder="Телефон"
        autocomplete="tel"
        required
      />
      <input
        class="reg-input"
        type="password"
        name="password"
        placeholder="Пароль"
        autocomplete="new-password"
        required
      />
      <input
        class="reg-input"
        type="password"
        name="password2"
        placeholder="Пароль еще раз"
        autocomplete="new-password"
        required
      />
      <button class="reg-button" type="submit">Регистрация</button>
    </form>
  </body>
</html>
