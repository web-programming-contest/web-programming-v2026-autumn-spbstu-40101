<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab4</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Управление студентами</h1>

    <section>
      <h2>Добавить студента</h2>
      <form data-testid="entity-form" id="student-form">
        <label>ID: <input type="number" name="id" required /></label>
        <label>Имя: <input type="text" name="name" required /></label>
        <button type="submit">Добавить студента</button>
      </form>
    </section>

    <section>
      <h2>Добавить оценку</h2>
      <form id="grade-form">
        <label
          >ID студента: <input type="number" name="studentId" required
        /></label>
        <label>Предмет: <input type="text" name="subject" required /></label>
        <label
          >Оценка: <input type="number" name="grade" min="1" max="100" required
        /></label>
        <button type="submit">Добавить оценку</button>
      </form>
    </section>

    <section>
      <h2>Список студентов</h2>
      <div data-testid="entity-list" id="student-list"></div>
    </section>

    <script type="module" src="main.js"></script>
  </body>
</html>
