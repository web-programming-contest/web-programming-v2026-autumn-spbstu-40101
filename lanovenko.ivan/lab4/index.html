<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Лабораторная работа 4</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <h1>Лабораторная работа 4</h1>
      <form class="user-form" data-testid="entity-form">
        <label class="field">
          <span>ID</span>
          <input type="number" name="id" required />
        </label>
        <label class="field">
          <span>Имя</span>
          <input type="text" name="name" required />
        </label>
        <button class="button" type="submit">Добавить пользователя</button>
      </form>
      <p class="message" data-testid="message" role="alert"></p>
      <section
        class="card-list"
        data-testid="entity-list"
        aria-label="Список элементов"
      ></section>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
