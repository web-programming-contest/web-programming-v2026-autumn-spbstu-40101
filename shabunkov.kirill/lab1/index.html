<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Регистрация — вариант 24</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="page">
      <form class="registration-form">
        <h1 class="registration-form-title">Регистрация</h1>

        <div class="form-field">
          <label for="first-name">Имя</label>
          <input
            id="first-name"
            name="firstName"
            type="text"
            autocomplete="given-name"
            required
          />
        </div>

        <div class="form-field">
          <label for="last-name">Фамилия</label>
          <input
            id="last-name"
            name="lastName"
            type="text"
            autocomplete="family-name"
            required
          />
        </div>

        <div class="form-field">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
          />
        </div>

        <div class="form-field">
          <label for="password">Пароль</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="new-password"
            required
          />
        </div>

        <div class="form-field">
          <label for="password-confirmation">Подтверждение пароля</label>
          <input
            id="password-confirmation"
            name="passwordConfirmation"
            type="password"
            autocomplete="new-password"
            required
          />
        </div>

        <div class="form-field">
          <label for="birth-date">Дата рождения</label>
          <input id="birth-date" name="birthDate" type="date" required />
        </div>

        <div class="form-field">
          <label for="country">Страна</label>
          <select id="country" name="country" required>
            <option value="">Выберите страну</option>
            <option value="russia">Россия</option>
            <option value="belarus">Беларусь</option>
            <option value="kazakhstan">Казахстан</option>
            <option value="other">Другая</option>
          </select>
        </div>

        <label class="consent-field">
          <input name="consent" type="checkbox" required />
          <span>Я согласен с условиями регистрации</span>
        </label>

        <button class="submit-button" type="submit">Зарегистрироваться</button>
      </form>
    </main>
  </body>
</html>
