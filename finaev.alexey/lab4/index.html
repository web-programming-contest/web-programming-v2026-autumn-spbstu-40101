<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Лабораторная_4</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Управление пользователями</h1>

      <form data-testid="entity-form" id="create-user-form">
        <input type="number" name="id" placeholder="ID" required />
        <input type="text" name="name" placeholder="Имя" required />
        <button type="submit">Добавить пользователя</button>
      </form>

      <form id="add-friend-form">
        <input
          type="number"
          name="iserId"
          placeholder="ID пользователя"
          required
        />
        <input type="number" name="friendId" placeholder="ID друга" required />
        <button type="submit">Добавить друга</button>
      </form>

      <div data-testid="entity-list" id="entity-list"></div>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
